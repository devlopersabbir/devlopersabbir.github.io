name: Website Keep-Alive & Health Check

on:
  schedule:
    # Runs every 15 minutes to keep site/services warm
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Portfolio Website
        run: |
          echo "Pinging https://devlopersabbir.github.io ..."
          curl -sSL --fail -I https://devlopersabbir.github.io || exit 1
          echo "Website is up and running!"
