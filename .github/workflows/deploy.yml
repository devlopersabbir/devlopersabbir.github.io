name: Deploy Astro Site

on:
  push:
    branches:
      - main
  schedule:
    # Rebuild and redeploy every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Prevent overlapping deploys
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup Bun package manager
      - name: Setup Bun package manager
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Install dependencies
      - name: Install dependencies
        run: bun install

      # Create environment file
      - name: Create .env
        run: |
          echo "API_KEY=${{ secrets.API_KEY }}" >> .env
          echo "PUBLIC_GROQ_API_KEY=${{ secrets.PUBLIC_GROQ_API_KEY }}" >> .env

      # Build Astro
      - name: Build project
        env:
          PUBLIC_GROQ_API_KEY: ${{ secrets.PUBLIC_GROQ_API_KEY }}
        run: bun run build

      # Disable Jekyll completely
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      # Upload static files
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
